<svg xmlns="http://www.w3.org/2000/svg" width="840" height="336" viewBox="0 0 840 336" role="img" aria-label="neofetch style profile card">
  <style>
    text { font-family: ui-monospace,'SFMono-Regular','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace; font-size: 15px; dominant-baseline: middle; }
    .t    { font-size: 13px; letter-spacing: 0.5px; }
    .dim  { fill: #7b7591; }
    .fg   { fill: #e2dfeb; }
    .pur  { fill: #9b7bff; }
    .teal { fill: #4fd1c5; }
    .amb  { fill: #f6ad55; }
    .h1   { font-size: 21px; font-weight: 700; fill: #f2f0f7; }
    .lbl  { fill: #9b7bff; font-weight: 600; letter-spacing: 1px; }
    .cur  { fill: #9b7bff; animation: blink 1.15s step-end infinite; }
    .rung { animation: pulse 2.6s ease-in-out infinite; }
    .helix{ animation: drift 9s ease-in-out infinite; transform-origin: center; }
    @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes drift { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
  </style>

  <defs>
    <clipPath id="card"><rect x="0.5" y="0.5" width="839" height="335" rx="11"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1526"/><stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="840" height="336" fill="url(#glow)"/>
    <rect width="840" height="36" fill="#1c1a22"/>
    <rect y="35.5" width="840" height="1" fill="#2c2640"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="335" rx="11" fill="none" stroke="#2c2640"/>
  <text x="20" y="23" class="t dim">system.log</text>
  <g opacity="0.85">
    <circle cx="778" cy="18" r="5" fill="#f56565"/>
    <circle cx="798" cy="18" r="5" fill="#ecc94b"/>
    <circle cx="818" cy="18" r="5" fill="#48bb78"/>
  </g>

  <text x="28" y="68" class="dim">gabrielvpina@github:~$ <tspan class="pur">neofetch</tspan></text>
  <line x1="28" y1="86" x2="812" y2="86" stroke="#2c2640"/>
  <text x="28" y="104" class="lbl">USER</text><text x="112" y="104" class="dim">::</text><text x="146" y="104"><tspan class="fg">gabrielvpina</tspan></text>
  <text x="28" y="134" class="lbl">FIELD</text><text x="112" y="134" class="dim">::</text><text x="146" y="134"><tspan class="teal">Bioinformatics</tspan><tspan class="dim"> :: </tspan><tspan class="teal">Virology</tspan></text>
  <text x="28" y="164" class="lbl">AFFIL</text><text x="112" y="164" class="dim">::</text><text x="146" y="164"><tspan class="fg">Univ. Estadual de Santa Cruz, Ilheus, BA</tspan></text>
  <text x="28" y="194" class="lbl">DEGREE</text><text x="112" y="194" class="dim">::</text><text x="146" y="194"><tspan class="fg">MSc. Genetics and Molecular Biology</tspan><tspan class="dim">  //  </tspan><tspan class="amb">PhD in progress</tspan></text>
  <text x="28" y="224" class="lbl">LANGS</text><text x="112" y="224" class="dim">::</text><text x="146" y="224"><tspan class="pur">R</tspan><tspan class="dim"> :: </tspan><tspan class="pur">Python</tspan><tspan class="dim"> :: </tspan><tspan class="pur">Bash</tspan></text>
  <text x="28" y="254" class="lbl">STACK</text><text x="112" y="254" class="dim">::</text><text x="146" y="254"><tspan class="fg">Linux</tspan><tspan class="dim"> :: </tspan><tspan class="fg">Docker</tspan><tspan class="dim"> :: </tspan><tspan class="fg">Nextflow</tspan><tspan class="dim"> :: </tspan><tspan class="fg">Git</tspan></text>
  <text x="28" y="284" class="lbl">FOCUS</text><text x="112" y="284" class="dim">::</text><text x="146" y="284"><tspan class="amb">finding viruses in data that already exists</tspan></text>
</svg>
